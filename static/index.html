<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>WI-FI connection setup</title>
    <link rel="stylesheet" media="all" href="style.css" />
    <script type="text/javascript" src="main.js"></script>
</head>

<body>
    <div class="flexbox-panel">
        <div class="flex-item box1 menu" id="menu-box">
            <p><a href="index.html">WI-FI connection setup</a></p>
            <p><a href="fw.html">Firmware update</a></p>
            <p><a href="ip.html">IP address configuration</a></p>
        </div>
        <div class="flex-item box1 main" id="main-box">
            <div class="title">
                <div class="wifi">
                    <h2>WI-FI connection setup WIFI</h2>
                </div>
                <div class="img"><img src="data:image/gif;base64,R0lGODlhYgBiAMQQAH9/fxAQEO/v70BAQL+/v6+vr2BgYN/f3yAgIM/Pz5..." /></div>
            </div>
            <form action="">
                <table class="box3">
                    <tr class="box2">
                        <td><p>WI-FI Access point name</p></td>
                        <td><input maxlength=32 name="ap" required id="ap-name-box" type="text"></td>
                    </tr>
                    <tr class="box2">
                        <td><p>Password</p></td>
                        <td>
                            <div>
                                <input id="pwdbox" type="password" maxlength=32 minlength="8" name="password" required />
                                <i id="pb" class="pb pbs">&nbsp;</i>
                            </div>
                        </td>
                    </tr>
                </table>
                <button type="submit" class="subbut">
                    <p class="buttext">Connect</p>
                </button>
            </form>
            <div class="list">
                <hr>
                <div class="ap_list" id="ap-list"></div>
            </div>
            <div class="info">
                <table style="font-size: 10pt; color: #666;">
                    <tr><td align="right">MAC:</td><td><div id="mac"> - </div></td></tr>
                    <tr><td align="right"> Device serial:</td><td><div id="serial"> - </div></td></tr>
                    <tr><td align="right">FW Version:</td><td><div id="ver"> - </div></td></tr>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
