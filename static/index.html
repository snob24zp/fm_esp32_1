<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>WI-FI connection setup</title>
    <link rel="stylesheet" media="all" href="style.css" />
    <script type="text/javascript" src="main.js"></script>
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function () {
            get("/info", function (inf) {
                info = inf
                let ver = inf.version.split(';')
                $("serial").innerText = inf.serial
                $("mac").innerText = inf.mac
                $("ver").innerText = ver[0] + " " + ver[1] + " " + ver[2].slice(0, 8)
                document.getElementById("ap-list").innerHTML =
                    "<div class=\"lds-ring\"><div></div><div></div><div></div><div></div></div>"
                get_ap_list(append_ap);
            })
            $("pb").addEventListener("click", () => {
                const p = $("pwdbox")
                const type = p.getAttribute('type') === 'password' ? 'text' : 'password';
                p.setAttribute('type', type);
                $("pb").classList.toggle('pbs');
                $("pb").classList.toggle('pbc');
            }, false)
        });
    </script>
</head>


<body>
    <div class="flexbox-panel">
        <div class="flex-item box1 menu" id="menu-box">
            <p><a href="index.html">WI-FI connection setup</a></p>
            <p><a href="fw.html">Firmware update</a></p>
            <p><a href="ip.html">IP address configuration</a></p>
        </div>
        <div class="flex-item box1 main" id="main-box">

            <form action="" method="" onsubmit="return false;">
                <table class="box3">
                    <tr class="box2">
                        <td>
                            <p>WI-FI Access point name</p>
                        </td>
                        <td><input type="text" maxlength=32 name="ap" required id="ap-name-box" /></td>
                    </tr>
                    <tr class="box2">
                        <td>
                            <p>Password</p>
                        </td>

                        <td>
                            <div>
                                <input id="pwdbox" type="password" maxlength=32 minlength="8" name="password"
                                    required />
                                <i id="pb" class="pb pbs">&nbsp;</i>
                            </div>

                    </tr>
                </table>

                <button class="subbut" onclick="send_ctrl()">
                    <p class="buttext">Connect</p>
                </button>
            </form>
            <div class="list">
                <hr>
                <div class="ap_list" id="ap-list">
                </div>
            </div>
            <div class="info">

                    <tr>

                        </td>

            </div>
