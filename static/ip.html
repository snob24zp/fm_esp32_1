<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>IP address configuration</title>
    <link rel="stylesheet" media="all" href="style.css" />
    <script type="text/javascript" src="main.js"></script>
</head>

<body>
    <div class="flexbox-panel">
        <div class="flex-item box1 menu" id="menu-box">
            <p><a href="index.html">WI-FI connection setup</a></p>
            <p><a href="fw.html">Firmware update</a></p>
            <p><a href="ip.html">IP address configuration</a></p>
        </div>

        <div class="flex-item main box1" id="main-box">
            <div class="title">
                <div class="wifi"><h2>IP address configuration</h2></div>
                <div class="img"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAE..." /></div>
            </div>
            <form action="">
                <table class="box3">
                    <tr class="box2">
                        <td><p>Type</p></td>
                        <td>
                            <select id="ip_type">
                                <option value="static">Static IP address</option>
                                <option value="dhcp">DHCP (Automatic address assign)</option>
                            </select>
                        </td>
                    </tr>
                    <tr class="box2">
                        <td><p>IP Address</p></td>
                        <td><input type="text" minlength="7" maxlength="15" size="15" pattern="^((\d{1,2}|1\d\d|2[0-4]\d|25[0-5])\.){3}(\d{1,2}|1\d\d|2[0-4]\d|25[0-5])$" required name="ip" id="ip" /></td>
                    </tr>
                    <tr class="box2">
                        <td><p>Network Mask</p></td>
                        <td><input type="text" minlength="7" maxlength="15" size="15" pattern="^((\d{1,2}|1\d\d|2[0-4]\d|25[0-5])\.){3}(\d{1,2}|1\d\d|2[0-4]\d|25[0-5])$" required name="mask" value="255.255.255.0" id="mask" /></td>
                    </tr>
                    <tr class="box2">
                        <td><p>Gateway</p></td>
                        <td><input type="text" minlength="7" maxlength="15" size="15" pattern="^((\d{1,2}|1\d\d|2[0-4]\d|25[0-5])\.){3}(\d{1,2}|1\d\d|2[0-4]\d|25[0-5])$" required name="gw" id="gw" /></td>
                    </tr>
                    <tr class="box2">
                        <td><p>DNS</p></td>
                        <td><input type="text" minlength="7" maxlength="15" size="15" pattern="^((\d{1,2}|1\d\d|2[0-4]\d|25[0-5])\.){3}(\d{1,2}|1\d\d|2[0-4]\d|25[0-5])$" required name="dns" id="dns" /></td>
                    </tr>
                </table>
                <button type="submit" class="subbut">
                    <p class="buttext">Change</p>
                </button>
            </form>

            <div class="info">
                <p><a href="fw.html">Firmware update</a></p>
                <table style="font-size: 10pt; color: #666;">
                    <tr><td align="right">MAC:</td><td><div id="mac"> - </div></td></tr>
                    <tr><td align="right"> Device serial:</td><td><div id="serial"> - </div></td></tr>
                    <tr><td align="right">FW Version:</td><td><div id="ver"> - </div></td></tr>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
